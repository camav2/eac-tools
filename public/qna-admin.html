<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Author Editorial Q&A — EAC Tools</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #00003D;
      --navy-light: #1a1a5e;
      --grey-100: #f3f4f6;
      --grey-200: #e5e7eb;
      --grey-500: #6b7280;
      --grey-700: #374151;
      --green: #059669;
      --amber: #d97706;
      --red: #dc2626;
      --radius: 10px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fb; color: var(--navy); min-height: 100vh; }

    /* ── Header ── */
    .site-header { display: flex; align-items: center; justify-content: space-between; padding: 0 32px; height: 60px; background: #fff; border-bottom: 1px solid var(--grey-200); position: sticky; top: 0; z-index: 100; }
    .header-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--navy); }
    .header-logo-img { width: 28px; height: 28px; }
    .header-logo-text { font-weight: 700; font-size: 1rem; letter-spacing: -0.01em; }
    .beta-badge { font-size: 0.65rem; font-weight: 700; background: var(--navy); color: #fff; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.05em; text-transform: uppercase; }
    .header-auth { position: relative; display: flex; align-items: center; }
    .header-user-btn { display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
    .header-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
    .header-avatar-placeholder { width: 30px; height: 30px; border-radius: 50%; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; }
    .header-user-name { font-size: 0.875rem; font-weight: 500; }
    .header-chevron { opacity: 0.5; }
    .header-dropdown { display: none; position: absolute; right: 0; top: calc(100% + 8px); background: #fff; border: 1px solid var(--grey-200); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,10,0.1); min-width: 180px; padding: 4px; }
    .header-dropdown.open { display: block; }
    .dropdown-item { display: block; width: 100%; text-align: left; padding: 8px 12px; border-radius: 5px; font-size: 0.875rem; color: var(--navy); text-decoration: none; background: none; border: none; cursor: pointer; }
    .dropdown-item:hover { background: var(--grey-100); }
    .dropdown-divider { height: 1px; background: var(--grey-200); margin: 4px 0; }
    .dropdown-logout { color: var(--red); }

    /* ── Page ── */
    .page-wrap { max-width: 1080px; margin: 0 auto; padding: 48px 24px 80px; }
    .page-eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--grey-500); margin-bottom: 8px; }
    .page-title { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; display: flex; align-items: center; gap: 12px; }
    .admin-badge { font-size: 0.65rem; font-weight: 700; background: var(--navy); color: #fff; padding: 3px 8px; border-radius: 99px; letter-spacing: 0.06em; text-transform: uppercase; vertical-align: middle; }
    .page-sub { color: var(--grey-500); font-size: 0.95rem; margin-top: 8px; max-width: 640px; }

    /* ── Author table ── */
    .authors-table-wrap { margin-top: 32px; background: #fff; border: 1px solid var(--grey-200); border-radius: var(--radius); overflow: hidden; }
    .authors-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    .authors-table th { text-align: left; padding: 12px 16px; font-weight: 600; font-size: 0.72rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--grey-500); border-bottom: 2px solid var(--grey-200); background: var(--grey-100); }
    .authors-table td { padding: 14px 16px; border-bottom: 1px solid var(--grey-200); vertical-align: top; }
    .authors-table tr:last-child td { border-bottom: none; }
    .authors-table tr:hover td { background: #fafbfc; }
    .author-cell { display: flex; align-items: center; gap: 10px; }
    .author-photo { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .author-photo-placeholder { width: 32px; height: 32px; border-radius: 50%; background: var(--grey-200); color: var(--grey-500); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700; flex-shrink: 0; }
    .author-name { font-weight: 700; }
    .book-title { color: var(--grey-700); }
    .book-date { color: var(--grey-500); font-size: 0.8rem; white-space: nowrap; }

    .bucket-buttons { display: inline-flex; gap: 6px; }
    .bucket-btn { font-size: 0.72rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--grey-200); background: #fff; color: var(--grey-500); cursor: pointer; transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
    .bucket-btn:hover:not(:disabled) { border-color: var(--grey-500); color: var(--grey-700); }
    .bucket-btn:disabled { opacity: 0.5; cursor: default; }
    .bucket-btn-recent.active      { background: #d1fae5; color: #065f46; border-color: #d1fae5; }
    .bucket-btn-established.active { background: #dbeafe; color: #1d4ed8; border-color: #dbeafe; }

    .status-pill { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--grey-100); color: var(--grey-700); }
    .status-Published          { background: #d1fae5; color: #065f46; }
    .status-Approved           { background: #ede9fe; color: #5b21b6; }
    .status-Draft-Ready        { background: #dbeafe; color: #1d4ed8; }
    .status-Author-Responded   { background: #cffafe; color: #155e75; }
    .status-Sent-to-Author     { background: #ffedd5; color: #9a3412; }
    .status-Questions-Generated{ background: #fef9c3; color: #854d0e; }
    .status-Skipped            { background: #fee2e2; color: #991b1b; }

    .questions-btn { font-size: 0.72rem; font-weight: 600; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--grey-200); background: #fff; color: var(--grey-700); cursor: pointer; white-space: nowrap; }
    .questions-btn:hover { border-color: var(--grey-500); }
    .questions-btn.has-set { background: var(--grey-100); }
    .questions-btn:disabled { opacity: 0.5; cursor: default; }

    /* ── Loading / empty / error ── */
    .loading, .empty-state { color: var(--grey-500); font-size: 0.9rem; padding: 40px 16px; text-align: center; }
    .error-state { color: var(--red); font-size: 0.9rem; padding: 40px 16px; text-align: center; }

    /* ── Question review panel ── */
    .back-link { display: inline-flex; align-items: center; gap: 4px; font-size: 0.85rem; font-weight: 600; color: var(--grey-500); text-decoration: none; cursor: pointer; border: none; background: none; padding: 0; margin-bottom: 20px; }
    .back-link:hover { color: var(--navy); }
    .review-panel { margin-top: 8px; background: #fff; border: 1px solid var(--grey-200); border-radius: var(--radius); padding: 28px 32px; }
    .review-header { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; }
    .review-author-name { font-size: 1.2rem; font-weight: 800; }
    .review-book-title { color: var(--grey-500); font-size: 0.9rem; margin-bottom: 24px; }
    .generate-btn { background: var(--navy); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
    .generate-btn:hover:not(:disabled) { background: var(--navy-light); }
    .generate-btn:disabled { opacity: 0.5; cursor: default; }
    .question-field { margin-bottom: 16px; }
    .question-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--grey-500); margin-bottom: 6px; display: block; }
    .question-textarea { width: 100%; border: 1px solid var(--grey-200); border-radius: 8px; padding: 10px 12px; font-size: 0.9rem; font-family: inherit; color: var(--navy); resize: vertical; min-height: 52px; }
    .question-textarea:focus { outline: none; border-color: var(--navy); }
    .review-actions { display: flex; align-items: center; gap: 12px; margin-top: 24px; }
    .save-btn { background: var(--green); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
    .save-btn:hover:not(:disabled) { opacity: 0.9; }
    .save-btn:disabled { opacity: 0.5; cursor: default; }
    .review-status { font-size: 0.85rem; color: var(--grey-500); }
    .review-status.ok { color: var(--green); }
    .review-status.err { color: var(--red); }

    /* ── Send link ── */
    .send-panel { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--grey-200); }
    .send-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; }
    .send-sub { font-size: 0.82rem; color: var(--grey-500); margin-bottom: 16px; }
    .send-btn { background: #fff; color: var(--navy); border: 1px solid var(--navy); padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
    .send-btn:hover:not(:disabled) { background: var(--grey-100); }
    .send-btn:disabled { opacity: 0.5; cursor: default; }
    .link-row { display: flex; gap: 8px; margin-top: 14px; align-items: center; }
    .link-input { flex: 1; padding: 9px 12px; border: 1px solid var(--grey-200); border-radius: 8px; font-size: 0.8rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--grey-700); background: var(--grey-100); }
    .copy-btn { background: var(--navy); color: #fff; border: none; padding: 9px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; white-space: nowrap; }
    .regen-link { font-size: 0.78rem; color: var(--grey-500); text-decoration: underline; background: none; border: none; cursor: pointer; padding: 0; margin-top: 12px; display: inline-block; }
    .regen-link:hover { color: var(--red); }

    /* ── Responses review ── */
    .resp-block { padding: 20px 0; border-bottom: 1px solid var(--grey-200); }
    .resp-block:last-child { border-bottom: none; }
    .resp-q { font-size: 0.95rem; font-weight: 700; margin-bottom: 10px; line-height: 1.45; }
    .resp-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--grey-500); margin-bottom: 5px; }
    .resp-text { font-size: 0.9rem; color: var(--grey-700); white-space: pre-wrap; line-height: 1.65; margin-bottom: 14px; }
    .resp-empty { font-size: 0.85rem; color: var(--grey-500); font-style: italic; }
    .resp-audio { width: 100%; max-width: 420px; margin-bottom: 10px; display: block; }
    .transcribe-btn { background: #fff; color: var(--navy); border: 1px solid var(--navy); padding: 6px 13px; border-radius: 6px; font-weight: 600; font-size: 0.78rem; cursor: pointer; }
    .transcribe-btn:hover:not(:disabled) { background: var(--grey-100); }
    .transcribe-btn:disabled { opacity: 0.5; cursor: default; }
    .transcript-box { background: var(--grey-100); border-left: 3px solid var(--navy); padding: 12px 14px; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: var(--grey-700); white-space: pre-wrap; line-height: 1.65; margin-top: 10px; }
    .resp-meta { font-size: 0.8rem; color: var(--grey-500); margin-bottom: 20px; }
  </style>
</head>
<body>

<header class="site-header">
  <a class="header-logo" href="https://hub.expertauthor.community">
    <img class="header-logo-img" src="/eac-logo.png" alt="EAC" onerror="this.style.display='none'">
    <span class="header-logo-text">Author Hub</span><span class="beta-badge">Beta</span>
  </a>
  <div class="header-auth" id="header-auth"></div>
</header>

<div class="page-wrap">
  <div class="page-eyebrow">Admin</div>
  <h1 class="page-title">Author Editorial Q&amp;A <span class="admin-badge">Admin only</span></h1>
  <p class="page-sub">EAC's authors, listed by publish date. Not testimonials — magazine-style interviews about what writing and publishing actually taught them, published to their author page.</p>

  <div id="authors-content">
    <p class="loading">Loading authors…</p>
  </div>

  <div id="question-review" style="display:none"></div>
</div>

<script src="/eac.js"></script>
<script>requireAuth();</script>
<script>
var currentAuthors = [];

eacAuthReady.then(function() {
  if (!eacUser || !eacUser.isAdmin) {
    window.location.replace('/dashboard');
    return;
  }
  loadAuthors();
});

document.getElementById('authors-content').addEventListener('click', function(e) {
  var bucketBtn = e.target.closest('.bucket-btn');
  if (bucketBtn) { assignBucket(bucketBtn.dataset.authorId, bucketBtn.dataset.bucket, bucketBtn); return; }
  var qBtn = e.target.closest('.questions-btn');
  if (qBtn) {
    if (qBtn.dataset.responsesId) openResponses(qBtn.dataset.responsesId);
    else openQuestionReview(qBtn.dataset.authorId);
    return;
  }
});

async function loadAuthors() {
  var container = document.getElementById('authors-content');
  try {
    var res = await fetch('/api/qna-authors');
    if (!res.ok) throw new Error('API error ' + res.status);
    var data = await res.json();
    currentAuthors = data.authors || [];
    renderAuthors(currentAuthors);
  } catch (err) {
    container.innerHTML = '<p class="error-state">Failed to load authors: ' + escHtml(err.message) + '</p>';
  }
}

async function assignBucket(authorItemId, bucket, btnEl) {
  var author = currentAuthors.find(function(a) { return a.authorItemId === authorItemId; });
  if (!author) return;

  var wrap = btnEl.closest('.bucket-buttons');
  wrap.querySelectorAll('.bucket-btn').forEach(function(b) { b.disabled = true; });

  try {
    var res = await fetch('/api/qna-authors', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        authorItemId:  author.authorItemId,
        bookItemId:    author.bookItemId,
        authorName:    author.authorName,
        bookTitle:     author.bookTitle,
        publishedDate: author.publishedDate,
        bucket:        bucket,
      }),
    });
    if (!res.ok) throw new Error('API error ' + res.status);
    var data = await res.json();
    author.bucket = data.bucket;
    author.status = data.status;
    author.recordId = data.recordId;
    renderAuthors(currentAuthors);
  } catch (err) {
    alert('Failed to save bucket: ' + err.message);
    wrap.querySelectorAll('.bucket-btn').forEach(function(b) { b.disabled = false; });
  }
}

function formatDate(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-AU', { day: '2-digit', month: 'short', year: 'numeric' });
}

function bucketButtons(a) {
  var recentActive = a.bucket === 'Recent' ? ' active' : '';
  var establishedActive = a.bucket === 'Established' ? ' active' : '';
  var id = escHtml(a.authorItemId);
  return '<div class="bucket-buttons">' +
    '<button type="button" class="bucket-btn bucket-btn-recent' + recentActive + '" data-author-id="' + id + '" data-bucket="Recent">Recent</button>' +
    '<button type="button" class="bucket-btn bucket-btn-established' + establishedActive + '" data-author-id="' + id + '" data-bucket="Established">Established</button>' +
  '</div>';
}

var RESPONDED_STATUSES = ['Author Responded', 'Draft Ready', 'Approved', 'Published'];

function questionsButton(a) {
  if (!a.bucket) return '<span style="color:var(--grey-500);font-size:0.8rem;">—</span>';

  // Once the author has replied, the useful action is reading what came back.
  if (RESPONDED_STATUSES.indexOf(a.status) !== -1) {
    return '<button type="button" class="questions-btn has-set" data-responses-id="' +
      escHtml(a.authorItemId) + '">Responses</button>';
  }

  var hasSet = a.status && a.status !== 'Not Started';
  var label = hasSet ? 'Review' : 'Questions';
  return '<button type="button" class="questions-btn' + (hasSet ? ' has-set' : '') + '" data-author-id="' +
    escHtml(a.authorItemId) + '">' + label + '</button>';
}

function statusPill(status) {
  var cls = 'status-' + String(status).replace(/\s+/g, '-');
  return '<span class="status-pill ' + cls + '">' + escHtml(status) + '</span>';
}

function renderAuthors(authors) {
  var container = document.getElementById('authors-content');

  if (!authors.length) {
    container.innerHTML = '<p class="empty-state">No authors found in the Webflow Books collection.</p>';
    return;
  }

  var rows = authors.map(function(a) {
    var photo = a.authorPhotoUrl
      ? '<img class="author-photo" src="' + escHtml(a.authorPhotoUrl) + '" alt="">'
      : '<div class="author-photo-placeholder">' + escHtml(initials(a.authorName)) + '</div>';
    return '<tr>' +
      '<td><div class="author-cell">' + photo + '<div class="author-name">' + escHtml(a.authorName) + '</div></div></td>' +
      '<td><div class="book-title">' + escHtml(a.bookTitle) + '</div></td>' +
      '<td><span class="book-date">' + formatDate(a.publishedDate) + '</span></td>' +
      '<td>' + bucketButtons(a) + '</td>' +
      '<td>' + questionsButton(a) + '</td>' +
      '<td>' + statusPill(a.status) + '</td>' +
    '</tr>';
  }).join('');

  container.innerHTML =
    '<div class="authors-table-wrap">' +
      '<table class="authors-table">' +
        '<thead><tr><th>Author</th><th>Book</th><th>Published</th><th>Bucket</th><th>Questions</th><th>Status</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
    '</div>';
}

function initials(name) {
  var parts = String(name).trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
}

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── Question review panel ── */

async function openQuestionReview(authorItemId) {
  var author = currentAuthors.find(function(a) { return a.authorItemId === authorItemId; });
  if (!author) return;

  document.getElementById('authors-content').style.display = 'none';
  var panel = document.getElementById('question-review');
  panel.style.display = 'block';
  panel.innerHTML = '<p class="loading">Loading…</p>';

  try {
    var res = await fetch('/api/qna-questions?authorItemId=' + encodeURIComponent(authorItemId));
    if (!res.ok) {
      var errData = await res.json().catch(function() { return {}; });
      throw new Error(errData.error || ('API error ' + res.status));
    }
    var data = await res.json();
    renderReviewPanel(author, data);
  } catch (err) {
    panel.innerHTML =
      '<button type="button" class="back-link" onclick="closeQuestionReview()">&larr; Back to list</button>' +
      '<p class="error-state">Failed to load: ' + escHtml(err.message) + '</p>';
  }
}

function closeQuestionReview() {
  document.getElementById('question-review').style.display = 'none';
  document.getElementById('authors-content').style.display = 'block';
  loadAuthors();
}

function renderReviewPanel(author, data) {
  var panel = document.getElementById('question-review');
  var questions = data.questions || ['', '', '', '', '', ''];

  var fields = questions.map(function(q, i) {
    return '<div class="question-field">' +
      '<label class="question-label">Q' + (i + 1) + '</label>' +
      '<textarea class="question-textarea" rows="2">' + escHtml(q) + '</textarea>' +
    '</div>';
  }).join('');

  panel.innerHTML =
    '<button type="button" class="back-link" onclick="closeQuestionReview()">&larr; Back to list</button>' +
    '<div class="review-panel">' +
      '<div class="review-header"><span class="review-author-name">' + escHtml(author.authorName) + '</span></div>' +
      '<div class="review-book-title">' + escHtml(author.bookTitle) + ' · ' + escHtml(author.bucket) + '</div>' +
      '<button type="button" id="generate-btn" class="generate-btn">' +
        (data.questions ? 'Regenerate with AI' : 'Generate Questions with AI') +
      '</button>' +
      '<div style="margin-top:24px">' + fields + '</div>' +
      '<div class="review-actions">' +
        '<button type="button" id="save-btn" class="save-btn">Save Question Set</button>' +
        '<span class="review-status" id="review-status"></span>' +
      '</div>' +
      '<div class="send-panel">' +
        '<div class="send-title">Send to author</div>' +
        '<div class="send-sub">Creates a private link with these questions. Nothing is emailed — copy the link and send it yourself.</div>' +
        '<button type="button" id="send-btn" class="send-btn">Create intake link</button>' +
        '<div id="link-area"></div>' +
      '</div>' +
    '</div>';

  document.getElementById('generate-btn').addEventListener('click', function() { generateQuestionsForAuthor(author); });
  document.getElementById('save-btn').addEventListener('click', function() { saveQuestionsForAuthor(author); });
  document.getElementById('send-btn').addEventListener('click', function() { createIntakeLink(author, false); });

  showExistingLink(author);
}

/* Surfaces a link that was minted earlier, so it's available on every visit
 * rather than only in the moment it was created. */
async function showExistingLink(author) {
  try {
    var res = await fetch('/api/qna-send?authorItemId=' + encodeURIComponent(author.authorItemId));
    if (!res.ok) return;
    var data = await res.json();
    if (!data.url) return;
    var btn = document.getElementById('send-btn');
    if (btn) btn.textContent = 'Create a new link';
    renderLinkArea(author, data.url, data.submittedAt);
  } catch (err) { /* non-critical — the Create button still works */ }
}

function renderLinkArea(author, url, submittedAt) {
  var area = document.getElementById('link-area');
  if (!area) return;
  area.innerHTML =
    '<div class="link-row">' +
      '<input class="link-input" id="link-input" readonly value="' + escHtml(url) + '">' +
      '<button type="button" class="copy-btn" id="copy-btn">Copy</button>' +
      '<a class="copy-btn" href="' + escHtml(url) + '" target="_blank" rel="noopener" ' +
        'style="background:#fff;color:var(--navy);border:1px solid var(--navy);text-decoration:none">Open</a>' +
    '</div>' +
    (submittedAt
      ? '<p class="send-sub" style="margin-top:12px">Submitted ' + escHtml(formatDate(submittedAt)) +
        ' — the link now shows a thank-you page. Reopen it to edit or resubmit.</p>' +
        '<button type="button" class="send-btn" id="reopen-btn" style="margin-top:4px">Reopen for editing</button>'
      : '') +
    '<button type="button" class="regen-link" id="regen-btn">Issue a new link (invalidates this one)</button>';

  document.getElementById('copy-btn').addEventListener('click', function() {
    var input = document.getElementById('link-input');
    input.select();
    navigator.clipboard.writeText(input.value).then(function() {
      var b = document.getElementById('copy-btn');
      b.textContent = 'Copied';
      setTimeout(function() { b.textContent = 'Copy'; }, 1800);
    });
  });
  document.getElementById('regen-btn').addEventListener('click', function() { createIntakeLink(author, true); });
  var reopenBtn = document.getElementById('reopen-btn');
  if (reopenBtn) reopenBtn.addEventListener('click', function() { reopenSubmission(author); });
}

async function reopenSubmission(author) {
  var btn = document.getElementById('reopen-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Reopening…'; }
  try {
    var res = await fetch('/api/qna-send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ authorItemId: author.authorItemId, action: 'reopen' }),
    });
    if (!res.ok) {
      var e = await res.json().catch(function() { return {}; });
      throw new Error(e.error || ('API error ' + res.status));
    }
    var data = await res.json();
    author.status = data.status;
    renderLinkArea(author, data.url, null);
  } catch (err) {
    if (btn) { btn.disabled = false; btn.textContent = 'Reopen for editing'; }
    alert('Could not reopen: ' + err.message);
  }
}

async function createIntakeLink(author, regenerate) {
  if (regenerate && !confirm('Issue a new link for ' + author.authorName + '?\n\nThe existing link will stop working immediately. Only do this if the old link was shared by mistake.')) return;

  var btn = document.getElementById('send-btn');
  var area = document.getElementById('link-area');
  btn.disabled = true;
  area.innerHTML = '<p class="send-sub" style="margin-top:14px">Creating…</p>';

  try {
    var res = await fetch('/api/qna-send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ authorItemId: author.authorItemId, regenerate: !!regenerate }),
    });
    if (!res.ok) {
      var errData = await res.json().catch(function() { return {}; });
      throw new Error(errData.error || ('API error ' + res.status));
    }
    var data = await res.json();
    author.status = data.status;
    renderLinkArea(author, data.url, null);
  } catch (err) {
    area.innerHTML = '<p class="send-sub err" style="margin-top:14px;color:var(--red)">' + escHtml(err.message) + '</p>';
  } finally {
    btn.disabled = false;
  }
}

async function generateQuestionsForAuthor(author) {
  var btn = document.getElementById('generate-btn');
  var statusEl = document.getElementById('review-status');
  btn.disabled = true;
  statusEl.textContent = 'Generating… (this can take a moment)';
  statusEl.className = 'review-status';

  try {
    var res = await fetch('/api/qna-questions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ authorItemId: author.authorItemId, action: 'generate' }),
    });
    if (!res.ok) {
      var errData = await res.json().catch(function() { return {}; });
      throw new Error(errData.error || ('API error ' + res.status));
    }
    var data = await res.json();
    renderReviewPanel(author, data);
    document.getElementById('review-status').textContent = 'Generated — review and edit before saving.';
    document.getElementById('review-status').className = 'review-status ok';
  } catch (err) {
    statusEl.textContent = 'Failed: ' + err.message;
    statusEl.className = 'review-status err';
    btn.disabled = false;
  }
}

async function saveQuestionsForAuthor(author) {
  var textareas = document.querySelectorAll('.question-textarea');
  var questions = Array.prototype.map.call(textareas, function(t) { return t.value.trim(); });

  var btn = document.getElementById('save-btn');
  var statusEl = document.getElementById('review-status');
  btn.disabled = true;
  statusEl.textContent = 'Saving…';
  statusEl.className = 'review-status';

  try {
    var res = await fetch('/api/qna-questions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ authorItemId: author.authorItemId, action: 'save', questions: questions }),
    });
    if (!res.ok) {
      var errData = await res.json().catch(function() { return {}; });
      throw new Error(errData.error || ('API error ' + res.status));
    }
    statusEl.textContent = 'Saved.';
    statusEl.className = 'review-status ok';
  } catch (err) {
    statusEl.textContent = 'Failed: ' + err.message;
    statusEl.className = 'review-status err';
  } finally {
    btn.disabled = false;
  }
}

/* ── Responses review ── */

async function openResponses(authorItemId) {
  var author = currentAuthors.find(function(a) { return a.authorItemId === authorItemId; });
  if (!author) return;

  document.getElementById('authors-content').style.display = 'none';
  var panel = document.getElementById('question-review');
  panel.style.display = 'block';
  panel.innerHTML = '<p class="loading">Loading responses…</p>';

  try {
    var res = await fetch('/api/qna-responses?authorItemId=' + encodeURIComponent(authorItemId));
    if (!res.ok) {
      var e = await res.json().catch(function() { return {}; });
      throw new Error(e.error || ('API error ' + res.status));
    }
    renderResponses(authorItemId, await res.json());
  } catch (err) {
    panel.innerHTML =
      '<button type="button" class="back-link" onclick="closeQuestionReview()">&larr; Back to list</button>' +
      '<p class="error-state">Failed to load: ' + escHtml(err.message) + '</p>';
  }
}

function renderResponses(authorItemId, data) {
  var blocks = (data.responses || []).map(function(r, i) {
    var body = '';

    if (r.text && r.text.trim()) {
      body += '<div class="resp-label">Written answer</div><div class="resp-text">' + escHtml(r.text) + '</div>';
    }

    if (r.hasAudio) {
      body += '<div class="resp-label">Recorded answer</div>';
      body += r.audioUrl
        ? '<audio class="resp-audio" controls src="' + escHtml(r.audioUrl) + '"></audio>'
        : '<p class="resp-empty">Audio link could not be generated.</p>';
      body += r.transcript
        ? '<div class="transcript-box">' + escHtml(r.transcript) + '</div>'
        : '<button type="button" class="transcribe-btn" data-tq="' + i + '">Transcribe</button>' +
          '<span class="review-status" id="tstatus-' + i + '" style="margin-left:10px"></span>';
    }

    if (!body) body = '<p class="resp-empty">No answer given.</p>';

    return '<div class="resp-block">' +
      '<div class="resp-q">Q' + (i + 1) + '. ' + escHtml(r.question) + '</div>' + body +
    '</div>';
  }).join('');

  var untranscribed = (data.responses || []).filter(function(r) { return r.hasAudio && !r.transcript; }).length;

  document.getElementById('question-review').innerHTML =
    '<button type="button" class="back-link" onclick="closeQuestionReview()">&larr; Back to list</button>' +
    '<div class="review-panel">' +
      '<div class="review-header"><span class="review-author-name">' + escHtml(data.authorName) + '</span></div>' +
      '<div class="review-book-title">' + escHtml(data.bookTitle) + '</div>' +
      '<div class="resp-meta">' + escHtml(data.status) +
        (data.submittedAt ? ' · submitted ' + formatDate(data.submittedAt) : '') + '</div>' +
      (untranscribed
        ? '<button type="button" class="generate-btn" id="transcribe-all">Transcribe all ' + untranscribed + ' recording' + (untranscribed > 1 ? 's' : '') + '</button>' +
          '<span class="review-status" id="all-status" style="margin-left:12px"></span>'
        : '') +
      '<div style="margin-top:20px">' + blocks + '</div>' +
      '<div class="send-panel">' +
        '<div class="send-title">Intake link</div>' +
        '<div class="send-sub">The author\'s link — reopen the submission to edit or resubmit.</div>' +
        '<div id="link-area"></div>' +
      '</div>' +
    '</div>';

  document.querySelectorAll('[data-tq]').forEach(function(b) {
    b.addEventListener('click', function() { transcribeOne(authorItemId, Number(b.dataset.tq)); });
  });
  var allBtn = document.getElementById('transcribe-all');
  if (allBtn) allBtn.addEventListener('click', function() { transcribeAll(authorItemId, data); });

  var author = currentAuthors.find(function(a) { return a.authorItemId === authorItemId; });
  if (author) showExistingLink(author);
}

async function transcribeOne(authorItemId, i) {
  var btn = document.querySelector('[data-tq="' + i + '"]');
  var statusEl = document.getElementById('tstatus-' + i);
  if (btn) btn.disabled = true;
  if (statusEl) { statusEl.textContent = 'Transcribing…'; statusEl.className = 'review-status'; }

  try {
    var res = await fetch('/api/qna-responses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ authorItemId: authorItemId, questionIndex: i }),
    });
    if (!res.ok) {
      var e = await res.json().catch(function() { return {}; });
      throw new Error(e.error || ('API error ' + res.status));
    }
    openResponses(authorItemId); // re-render with the transcript in place
  } catch (err) {
    if (statusEl) { statusEl.textContent = 'Failed: ' + err.message; statusEl.className = 'review-status err'; }
    if (btn) btn.disabled = false;
  }
}

async function transcribeAll(authorItemId, data) {
  var pending = [];
  (data.responses || []).forEach(function(r, i) { if (r.hasAudio && !r.transcript) pending.push(i); });

  var btn = document.getElementById('transcribe-all');
  var statusEl = document.getElementById('all-status');
  if (btn) btn.disabled = true;

  // One request per recording — keeps each invocation short and shows progress.
  for (var n = 0; n < pending.length; n++) {
    if (statusEl) {
      statusEl.textContent = 'Transcribing ' + (n + 1) + ' of ' + pending.length + '…';
      statusEl.className = 'review-status';
    }
    var res = await fetch('/api/qna-responses', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ authorItemId: authorItemId, questionIndex: pending[n] }),
    });
    if (!res.ok) {
      var e = await res.json().catch(function() { return {}; });
      if (statusEl) {
        statusEl.textContent = 'Failed on recording ' + (n + 1) + ': ' + (e.error || res.status);
        statusEl.className = 'review-status err';
      }
      if (btn) btn.disabled = false;
      return;
    }
  }
  openResponses(authorItemId);
}
</script>
