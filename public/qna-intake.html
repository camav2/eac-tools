<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Editorial Q&amp;A — Expert Author Community</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #00003D;
      --yellow: #FFE64B;
      --grey-100: #f3f4f6;
      --grey-200: #e5e7eb;
      --grey-500: #6b7280;
      --grey-700: #374151;
      --green: #059669;
      --red: #dc2626;
    }
    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #faf9f7; color: var(--navy); line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .masthead { background: var(--navy); padding: 0 24px; height: 56px; display: flex; align-items: center; }
    .masthead img { height: 26px; }
    .masthead-text { color: #fff; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; margin-left: 10px; }

    .wrap { max-width: 680px; margin: 0 auto; padding: 56px 24px 96px; }

    .eyebrow { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--grey-500); }
    h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.2; margin: 10px 0 20px; }
    .intro p { margin-bottom: 16px; color: var(--grey-700); }
    .intro strong { color: var(--navy); }
    .rule { height: 3px; width: 56px; background: var(--yellow); margin: 32px 0; border-radius: 2px; }

    /* ── Hero: their face, their book ── */
    .hero { display: flex; gap: 22px; align-items: flex-start; }
    .hero-cover {
      width: 108px; flex-shrink: 0; height: auto; display: block;
      border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,61,0.18);
    }
    .hero-copy { flex: 1; min-width: 0; }
    .hero-who { display: flex; align-items: center; gap: 11px; }
    .hero-photo {
      width: 46px; height: 46px; flex-shrink: 0;
      border-radius: 50%; object-fit: cover; object-position: center top;
      border: 2px solid #fff; box-shadow: 0 2px 10px rgba(0,0,61,0.16);
    }
    .hero h1 { margin-top: 14px; }

    .q-block { margin-bottom: 36px; }
    .q-num { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; color: var(--grey-500); text-transform: uppercase; }
    .q-text { font-size: 1.05rem; font-weight: 600; margin: 6px 0 12px; line-height: 1.45; }
    textarea {
      width: 100%; min-height: 130px; padding: 14px 16px; font: inherit; font-size: 0.95rem;
      color: var(--navy); background: #fff; border: 1px solid var(--grey-200);
      border-radius: 10px; resize: vertical; line-height: 1.6;
    }
    textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(0,0,61,0.06); }

    /* ── Kelly's voice ── */
    .listen-btn {
      display: inline-flex; align-items: center; gap: 9px;
      background: var(--yellow); color: var(--navy); border: none;
      padding: 11px 20px; border-radius: 999px;
      font: inherit; font-size: 0.85rem; font-weight: 700; cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .listen-btn:hover { opacity: 0.85; }
    .listen-btn svg { width: 15px; height: 15px; flex-shrink: 0; }
    .listen-intro { margin: 4px 0 8px; }
    .listen-caption { font-size: 0.78rem; color: var(--grey-500); margin-top: 8px; }
    .listen-q {
      display: inline-flex; align-items: center; gap: 7px;
      background: none; border: none; padding: 4px 0; margin-bottom: 10px;
      font: inherit; font-size: 0.78rem; font-weight: 600; color: var(--grey-500);
      cursor: pointer;
    }
    .listen-q:hover { color: var(--navy); }
    .listen-q svg { width: 13px; height: 13px; flex-shrink: 0; }
    /* Kelly's face beside the button, not inside it: the button's label is
     * rewritten on play and pause, and anything inside would be wiped. */
    .listen-row { display: flex; align-items: center; gap: 10px; }
    .listen-photo {
      width: 36px; height: 36px; flex-shrink: 0;
      border-radius: 50%; object-fit: cover;
      border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,61,0.16);
    }
    .listen-photo.sm { width: 24px; height: 24px; border-width: 1px; }
    .listen-row .listen-q { margin-bottom: 0; }
    .listen-row-q { margin-bottom: 10px; }

    /* ── Audio ── */
    .or-rule { display: flex; align-items: center; gap: 12px; margin: 14px 0 12px; color: var(--grey-500); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
    .or-rule::before, .or-rule::after { content: ''; flex: 1; height: 1px; background: var(--grey-200); }
    .audio-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .rec-btn { display: inline-flex; align-items: center; gap: 8px; background: #fff; color: var(--navy); border: 1px solid var(--grey-200); padding: 10px 18px; border-radius: 999px; font: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: border-color 0.15s ease; }
    .rec-btn:hover:not(:disabled) { border-color: var(--navy); }
    .rec-btn:disabled { opacity: 0.45; cursor: default; }
    .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); flex-shrink: 0; }
    .rec-btn.recording { border-color: var(--red); color: var(--red); }
    .rec-btn.recording .rec-dot { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    .rec-timer { font-variant-numeric: tabular-nums; font-size: 0.85rem; font-weight: 600; color: var(--grey-700); }
    .rec-state { font-size: 0.8rem; color: var(--grey-500); }
    .rec-state.ok { color: var(--green); font-weight: 600; }
    .rec-state.err { color: var(--red); }
    .rec-audio { margin-top: 12px; width: 100%; max-width: 420px; display: block; }
    .rec-hint { font-size: 0.78rem; color: var(--grey-500); margin-top: 8px; }

    /* ── The author's own question ──
     * The prompt is Oscar Trimboli's question, so it is set as him asking it:
     * his face, and a thought bubble rather than a heading. A heading is the
     * form asking; this is a person asking, which is the whole point of it.
     */
    .own-intro { margin-top: 8px; }
    .own-intro p { font-size: 0.9rem; color: var(--grey-700); margin-bottom: 16px; }

    /* Centred rather than top-aligned: the bubble holds one line on a wide
     * screen and wraps to two or three on a narrow one, and centring is the
     * only alignment that looks deliberate at every width. */
    .ask { display: flex; align-items: center; gap: 18px; margin-bottom: 20px; }
    /* The file is already a square crop on his face at 232px — 4x the
     * display size, so it stays sharp on a retina screen. */
    .ask-photo {
      width: 58px; height: 58px; flex-shrink: 0;
      border-radius: 50%; object-fit: cover;
      border: 2px solid #fff; box-shadow: 0 2px 10px rgba(0,0,61,0.16);
    }
    .ask-bubble {
      position: relative; flex: 1; min-width: 0;
      background: #fff; border: 1px solid var(--grey-200);
      border-radius: 20px; padding: 16px 22px;
    }
    /* The two trailing circles are what make it a thought rather than speech. */
    .ask-bubble::before, .ask-bubble::after {
      content: ''; position: absolute;
      background: #fff; border: 1px solid var(--grey-200); border-radius: 50%;
    }
    .ask-bubble::before { width: 13px; height: 13px; left: -9px; bottom: 16px; }
    .ask-bubble::after  { width: 7px;  height: 7px;  left: -18px; bottom: 6px; }
    .ask-q { font-size: 1.05rem; font-weight: 600; line-height: 1.45; margin-bottom: 6px; }
    /* Just the name. The face says a person is asking; the name says which
     * person, for the many authors who will not recognise him on sight. */
    .ask-by { font-size: 0.75rem; font-weight: 600; color: var(--grey-500); }
    .own-block { border-left: 3px solid var(--yellow); padding-left: 18px; margin-bottom: 32px; }
    .own-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; color: var(--grey-500); text-transform: uppercase; margin-bottom: 6px; }
    .own-input {
      width: 100%; padding: 12px 14px; margin-bottom: 12px;
      font: inherit; font-size: 1.05rem; font-weight: 600; line-height: 1.45;
      color: var(--navy); background: #fff;
      border: 1px solid var(--grey-200); border-radius: 10px;
    }
    .own-input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(0,0,61,0.06); }
    .own-input.needs { border-color: var(--red); }
    .own-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 10px 0 12px; }
    .btn-ghost {
      display: inline-flex; align-items: center; gap: 8px;
      background: #fff; color: var(--navy); border: 1px solid var(--grey-200);
      padding: 9px 16px; border-radius: 999px;
      font: inherit; font-size: 0.82rem; font-weight: 600; cursor: pointer;
      transition: border-color 0.15s ease;
    }
    .btn-ghost:hover:not(:disabled) { border-color: var(--navy); }
    .btn-ghost:disabled { opacity: 0.45; cursor: default; }
    .own-state { font-size: 0.8rem; color: var(--grey-500); }
    .own-state.err { color: var(--red); }
    .btn-add { margin-top: 4px; }

    .consent { background: #fff; border: 1px solid var(--grey-200); border-radius: 12px; padding: 22px 24px; margin-top: 40px; }
    .consent h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; }
    .consent ul { list-style: none; font-size: 0.85rem; color: var(--grey-700); margin-bottom: 18px; }
    .consent li { padding-left: 20px; position: relative; margin-bottom: 7px; }
    .consent li::before { content: '—'; position: absolute; left: 0; color: var(--grey-500); }
    .consent-check { display: flex; gap: 11px; align-items: flex-start; }
    .consent-check input { margin-top: 4px; width: 17px; height: 17px; flex-shrink: 0; accent-color: var(--navy); cursor: pointer; }
    .consent-check label { font-size: 0.88rem; font-weight: 500; cursor: pointer; }

    .actions { margin-top: 28px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .btn-submit {
      background: var(--navy); color: #fff; border: none; padding: 15px 30px; border-radius: 999px;
      font: inherit; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: opacity 0.15s ease;
    }
    .btn-submit:hover:not(:disabled) { opacity: 0.88; }
    .btn-submit:disabled { opacity: 0.35; cursor: default; }
    .save-note { font-size: 0.8rem; color: var(--grey-500); }
    .save-note.ok { color: var(--green); }
    .save-note.err { color: var(--red); }

    .state { text-align: center; padding: 80px 24px; }
    .state h2 { font-size: 1.35rem; font-weight: 800; margin-bottom: 12px; }
    .state p { color: var(--grey-700); max-width: 460px; margin: 0 auto; }
    .state-icon { font-size: 2.4rem; margin-bottom: 18px; }

    /* ── Cameron's interview invitation, on the thank-you page ──
     * Deliberately after the thank-you rather than beside the questions: the
     * author has finished what we asked of them, so this is a request being
     * made, not a condition attached to the one they already answered.
     */
    .cta {
      max-width: 470px; margin: 48px auto 0;
      background: #fff; border: 1px solid var(--grey-200); border-radius: 14px;
      text-align: center;
      /* Clips the photo to the card's rounded top corners. */
      overflow: hidden;
    }
    /* Full bleed rather than a round headshot: the point of the picture is the
     * manuscripts all over the floor, which a 76px circle throws away. */
    .cta-image { width: 100%; height: auto; display: block; }
    .cta-body { padding: 24px 26px 28px; }
    .cta h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 10px; }
    .cta p { font-size: 0.9rem; color: var(--grey-700); margin-bottom: 8px; }
    .cta-btn {
      display: inline-block; margin-top: 14px;
      background: var(--navy); color: #fff; text-decoration: none;
      padding: 13px 26px; border-radius: 999px;
      font-size: 0.88rem; font-weight: 700;
      transition: opacity 0.15s ease;
    }
    .cta-btn:hover { opacity: 0.88; }
    .cta-note { font-size: 0.78rem; color: var(--grey-500); margin-top: 12px; }

    @media (max-width: 600px) {
      .wrap { padding: 36px 20px 72px; }
      h1 { font-size: 1.6rem; }
      .hero { flex-direction: column; gap: 16px; }
      .hero-cover { width: 88px; }
      .hero h1 { margin-top: 10px; }
    }
  </style>
</head>
<body>

<header class="masthead">
  <img src="/eac-logo.png" alt="" onerror="this.style.display='none'">
  <span class="masthead-text">Expert Author Community</span>
</header>

<div class="wrap" id="root">
  <p class="state">Loading…</p>
</div>

<script>
var TOKEN = new URLSearchParams(window.location.search).get('token') || '';

/* Cameron's booking link, shown on the thank-you page once an author has
 * finished. Empty means the invitation is not rendered at all — better no
 * block than a button that goes nowhere.
 *
 * The short calendar.app.google form redirects to the long appointment-schedule
 * URL. Kept short here because that is the link Cam holds and can reissue; the
 * expanded one is an implementation detail of Google's. */
var BOOKING_URL = 'https://calendar.app.google/s4DKVcDhsgfZgGBM9';
var state = {
  questions: [], authorQuestions: [], answers: [], hasAudio: [], audio: [],
  authorName: '', bookTitle: '', media: {},
};
var saveTimer = null;

/* An upload and a text save are both read-modify-write against the same
 * Responses blob, so a save whose read lands before the upload's write and
 * whose own write lands after it would erase the recording. Autosaves hold
 * off while an upload is in flight, and one runs as soon as it lands. */
var uploading = 0;
var savePending = false;

// Author-added questions are appended after Cam's set, so their page index is
// offset by however many questions he asked.
var MAX_OWN = 2;
function ownIndex(n) { return state.questions.length + n; }

var ICON_SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
  'stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5">' +
  '</polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14">' +
  '</path></svg>';
var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
  'stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect>' +
  '<rect x="14" y="4" width="4" height="16"></rect></svg>';

document.addEventListener('DOMContentLoaded', load);

async function load() {
  if (!TOKEN) return renderError('This link is missing its access code. Please use the full link from your email.');
  try {
    var res = await fetch('/api/qna-intake?token=' + encodeURIComponent(TOKEN));
    if (!res.ok) {
      var e = await res.json().catch(function() { return {}; });
      return renderError(e.error || 'This link is not valid.');
    }
    var data = await res.json();
    if (data.submitted) return renderSubmitted(data.authorName);
    state = data;
    // Everything the render path indexes into must exist, whatever the API
    // did or didn't send.
    state.questions = state.questions || [];
    state.authorQuestions = state.authorQuestions || [];
    state.answers = state.answers || [];
    state.hasAudio = state.hasAudio || [];
    state.audio = state.audio || [];
    state.media = state.media || {};
    renderForm();
  } catch (err) {
    renderError('We could not load your questions. Please check your connection and refresh.');
  }
}

function renderError(msg) {
  document.getElementById('root').innerHTML =
    '<div class="state"><div class="state-icon">🔒</div>' +
    '<h2>We can\'t open this page</h2><p>' + esc(msg) + '</p></div>';
}

function renderSubmitted(name) {
  document.getElementById('root').innerHTML =
    '<div class="state"><div class="state-icon">✓</div>' +
    '<h2>Thank you' + (name ? ', ' + esc(firstName(name)) : '') + '</h2>' +
    '<p>Your answers are in. We\'ll shape them into an edited Q&amp;A and send it to you ' +
    'for approval before anything is published.</p>' +
    ctaHtml() +
    '</div>';
}

/* Cameron's interview invitation.
 * Renders only when BOOKING_URL is set, so an unset link shows nothing rather
 * than a button that goes nowhere. */
function ctaHtml() {
  if (!BOOKING_URL) return '';
  return '<div class="cta">' +
    '<img class="cta-image" src="/cameron-kelly.webp" ' +
      'alt="Cameron and Kelly on the floor, working through printed manuscripts" ' +
      'onerror="this.remove()">' +
    '<div class="cta-body">' +
      '<h3>Before you go, can I ask you some questions?</h3>' +
      '<p>I\'m Cameron. I build the tools behind the Expert Author Community.</p>' +
      '<p>I\'m talking to members about what we should build next, and whether the ideas ' +
      'I have are any good. Nothing to sell you. Just questions, like these ones.</p>' +
      '<a class="cta-btn" href="' + esc(BOOKING_URL) + '" target="_blank" rel="noopener">' +
        'Book a time with me</a>' +
      '<div class="cta-note">We\'ll meet on Google Meet.</div>' +
    '</div>' +
  '</div>';
}

/* Answer box + recorder, shared by Cam's questions and the author's own. */
function answerHtml(i) {
  var already = state.hasAudio && state.hasAudio[i];
  var box = '<textarea data-i="' + i + '" placeholder="Take as much space as you need…">' +
    esc(state.answers[i] || '') + '</textarea>';

  // A recorder is only offered where the browser can actually make one, but a
  // recording made earlier on another device must still be playable here.
  if (!supportsRecording()) return box + playbackHtml(i);

  return box +
    '<div class="or-rule">or record your answer</div>' +
    '<div class="audio-row">' +
      '<button type="button" class="rec-btn" data-rec="' + i + '">' +
        '<span class="rec-dot"></span><span class="rec-label">Record</span>' +
      '</button>' +
      '<span class="rec-timer" id="timer-' + i + '"></span>' +
      '<span class="rec-state' + (already ? ' ok' : '') + '" id="recstate-' + i + '">' +
        (already ? 'Recording saved' : '') +
      '</span>' +
    '</div>' +
    '<div id="playback-' + i + '">' + playbackHtml(i) + '</div>';
}

/* Playback for a recording made in an earlier visit.
 * Coming back to "Recording saved" and no way to hear it is indistinguishable
 * from having lost it — which is exactly how it was reported. */
function playbackHtml(i) {
  var url = state.audio && state.audio[i];
  if (!url) return '';
  return '<audio class="rec-audio" controls preload="none" src="' + esc(url) + '"></audio>' +
    '<div class="rec-hint">Recording again will replace this one.</div>';
}

/* Shown only beside a clip that exists, so it never claims a voice that
 * failed to generate. */
function kellyPhoto(size) {
  return '<img class="listen-photo' + (size ? ' ' + size : '') + '" ' +
    'src="/kelly-irving.webp" alt="Kelly Irving" onerror="this.remove()">';
}

function heroHtml() {
  var m = state.media || {};
  var cover = m.bookCoverUrl
    ? '<img class="hero-cover" src="' + esc(m.bookCoverUrl) + '" alt="' + esc(m.bookCoverAlt || state.bookTitle) + '" ' +
      'onerror="this.remove()">'
    : '';
  var photo = m.authorPhotoUrl
    ? '<img class="hero-photo" src="' + esc(m.authorPhotoUrl) + '" alt="' + esc(m.authorPhotoAlt || state.authorName) + '" ' +
      'onerror="this.remove()">'
    : '';

  return '<div class="hero">' + cover +
    '<div class="hero-copy">' +
      '<div class="hero-who">' + photo +
        '<div class="eyebrow">Expert Author Community · Editorial</div>' +
      '</div>' +
      '<h1>' + esc(firstName(state.authorName)) + ', we\'d like to interview you about <em>' +
        esc(state.bookTitle) + '</em></h1>' +
    '</div>' +
  '</div>';
}

function renderForm() {
  var canRecord = supportsRecording();

  var qs = state.questions.map(function(q, i) {
    var qVoice = (state.voice && state.voice.questions && state.voice.questions[i]) || null;
    var listen = qVoice
      ? '<div class="listen-row listen-row-q">' + kellyPhoto('sm') +
          '<button type="button" class="listen-q" data-listen="' + esc(qVoice) + '">' +
            ICON_SPEAKER + 'Hear Kelly read this' +
          '</button>' +
        '</div>'
      : '';

    return '<div class="q-block">' +
      '<div class="q-num">Question ' + (i + 1) + ' of ' + state.questions.length + '</div>' +
      '<div class="q-text">' + esc(q) + '</div>' +
      listen +
      answerHtml(i) +
    '</div>';
  }).join('');

  var introVoice = (state.voice && state.voice.intro) || null;
  var introPlayer = introVoice
    ? '<div class="listen-intro">' +
        '<div class="listen-row">' + kellyPhoto('') +
          '<button type="button" class="listen-btn" data-listen="' + esc(introVoice) + '">' +
            ICON_SPEAKER + 'Hear from Kelly' +
          '</button>' +
        '</div>' +
        '<div class="listen-caption">About a minute, in Kelly\'s voice.</div>' +
      '</div>'
    : '';

  document.getElementById('root').innerHTML =
    heroHtml() +
    '<div class="intro">' +
      '<p>We\'re building an editorial home for the Expert Author Community — one that shares the ' +
      'thinking, lessons and lived experience behind meaningful books.</p>' +
      '<p><strong>This isn\'t a testimonial.</strong> We\'re not asking you to say nice things about EAC. ' +
      'We\'re interested in what the process of writing, publishing and articulating your ideas actually ' +
      'taught you — the things you\'d tell another expert who was about to start.</p>' +
      '<p>Answer in your own voice, at whatever length feels right — ' +
      (canRecord
        ? 'type your answers or record them out loud, whichever suits you. Most people find they say ' +
          'more, and say it better, when they talk. '
        : '') +
      'Everything saves as you go, so you can close this page and come back to it.</p>' +
    '</div>' +
    introPlayer +
    '<div class="rule"></div>' +
    qs +
    '<div class="own-intro">' +
      '<div class="ask">' +
        '<img class="ask-photo" src="/oscar-trimboli.webp" alt="Oscar Trimboli" ' +
          'onerror="this.remove()">' +
        '<div class="ask-bubble">' +
          '<p class="ask-q">Is there a question we didn\'t ask, but should have?</p>' +
          '<p class="ask-by">Oscar Trimboli</p>' +
        '</div>' +
      '</div>' +
      '<p>If there is, write it here and answer it yourself. Entirely optional — ' +
      'and if you change your mind, just leave it blank.</p>' +
    '</div>' +
    '<div id="own-list"></div>' +
    '<div class="own-tools">' +
      '<button type="button" class="btn-ghost btn-add" id="own-add">Add your own question</button>' +
      '<span class="own-state" id="own-state"></span>' +
    '</div>' +
    '<div class="consent">' +
      '<h2>Before you submit</h2>' +
      '<ul>' +
        '<li>EAC may use your responses to create an edited editorial feature.</li>' +
        '<li>We publish it on your author page and our blog, send it to our newsletter, and post ' +
          'it on the Expert Author Community LinkedIn page. Sometimes we pay to promote that post ' +
          'so it reaches more people.</li>' +
        '<li>We may lightly edit for clarity, structure and length, and may quote from your responses.</li>' +
        (canRecord
          ? '<li>Any recordings you make are transcribed for our editing process. <strong>We will only ' +
            'publish written text</strong> — your audio is never published or shared, and we will ask you ' +
            'separately if we ever want to use a clip.</li>'
          : '') +
        '<li>We will send you the final version for approval before anything is published.</li>' +
        '<li>Your raw answers are stored securely and stay inside EAC. Only the edited feature ' +
          'you have approved is published.</li>' +
      '</ul>' +
      '<div class="consent-check">' +
        '<input type="checkbox" id="consent">' +
        '<label for="consent">I understand and I\'m happy for my answers to be used on this basis.</label>' +
      '</div>' +
    '</div>' +
    '<div class="actions">' +
      '<button type="button" class="btn-submit" id="submit" disabled>Send my answers</button>' +
      '<span class="save-note" id="note"></span>' +
    '</div>' +
    '<p class="save-note" id="progress" style="margin-top:10px"></p>';

  bindAnswers(document);
  document.getElementById('consent').addEventListener('change', updateSubmitState);
  document.getElementById('submit').addEventListener('click', submit);
  document.getElementById('own-add').addEventListener('click', addOwn);

  document.querySelectorAll('[data-listen]').forEach(function(b) {
    b.addEventListener('click', function() { toggleListen(b); });
  });

  renderOwn();
  updateSubmitState();
}

/* Answer boxes and record buttons inside `root`. Called for the whole page on
 * first render, and again for just the author's own-question list as it grows. */
function bindAnswers(root) {
  root.querySelectorAll('textarea').forEach(function(t) {
    t.addEventListener('input', function() { scheduleSave(); updateSubmitState(); });
    t.addEventListener('blur', saveNow);
  });
  root.querySelectorAll('[data-rec]').forEach(function(b) {
    b.addEventListener('click', function() { toggleRecording(Number(b.dataset.rec)); });
  });
}

/* ── The author's own question ──
 * They write both halves. Slots are only ever appended, never removed or
 * reordered: an index that shifts underneath a saved recording would attach
 * it to the wrong question. Changing your mind is handled by leaving the slot
 * blank — the server drops empty slots on submit.
 */
function renderOwn() {
  var list = document.getElementById('own-list');
  if (!list) return;

  list.innerHTML = state.authorQuestions.map(function(q, n) {
    return '<div class="own-block">' +
      '<div class="own-label">Your question ' + (n + 1) + '</div>' +
      '<input type="text" class="own-input" data-aq="' + n + '" maxlength="300" ' +
        'placeholder="What do you wish we\'d asked you?" value="' + esc(q) + '">' +
      answerHtml(ownIndex(n)) +
    '</div>';
  }).join('');

  bindAnswers(list);
  list.querySelectorAll('[data-aq]').forEach(function(input) {
    input.addEventListener('input', function() { scheduleSave(); updateSubmitState(); });
    input.addEventListener('blur', saveNow);
  });

  var add = document.getElementById('own-add');
  if (add) {
    add.style.display = state.authorQuestions.length >= MAX_OWN ? 'none' : '';
    add.textContent = state.authorQuestions.length
      ? 'Add another question'
      : 'Add your own question';
  }
}

function addOwn() {
  // Re-rendering the list mid-recording would tear out the live recorder.
  if (rec.recorder && rec.recorder.state === 'recording') {
    return ownState('Finish your recording first.', 'err');
  }
  // The cap is a rule, not just a hidden button — a hidden button still fires
  // its click listener, and the server caps it too.
  if (state.authorQuestions.length >= MAX_OWN) return;

  syncToState();
  state.authorQuestions.push('');
  ownState('');
  renderOwn();
  updateSubmitState();

  var last = document.querySelector('[data-aq="' + (state.authorQuestions.length - 1) + '"]');
  if (last) last.focus();
}

function ownState(msg, cls) {
  var el = document.getElementById('own-state');
  if (!el) return;
  el.textContent = msg || '';
  el.className = 'own-state' + (cls ? ' ' + cls : '');
}

function currentAuthorQuestions() {
  var out = state.authorQuestions.map(function() { return ''; });
  document.querySelectorAll('[data-aq]').forEach(function(el) {
    out[Number(el.dataset.aq)] = el.value;
  });
  return out;
}

/* The inputs are the source of truth while the page is open; pull them back
 * into state before any re-render, or the boxes reset to their loaded values. */
function syncToState() {
  document.querySelectorAll('textarea[data-i]').forEach(function(t) {
    state.answers[Number(t.dataset.i)] = t.value;
  });
  document.querySelectorAll('[data-aq]').forEach(function(el) {
    state.authorQuestions[Number(el.dataset.aq)] = el.value;
  });
}

function answeredAt(answers, i) {
  return Boolean((answers[i] || '').trim() || (state.hasAudio && state.hasAudio[i]));
}

/* Runs on every keystroke, every recording and every consent tick. Two jobs:
 * gate the submit button on all of Cam's questions being answered (the server
 * enforces the same rule — this is here so nobody writes six answers and only
 * then finds out), and flag any of their own slots holding an answer with no
 * question written above it. */
function updateSubmitState() {
  var btn = document.getElementById('submit');
  var consent = document.getElementById('consent');
  var prog = document.getElementById('progress');
  if (!btn || !consent) return;

  var answers = currentAnswers();

  var missing = [];
  for (var i = 0; i < state.questions.length; i++) {
    if (!answeredAt(answers, i)) missing.push(i + 1);
  }

  // An answer typed under a blank question can't be sent — the server refuses
  // it rather than quietly binning their words, so say so here first.
  var qs = currentAuthorQuestions();
  var orphans = 0;
  qs.forEach(function(q, n) {
    var input = document.querySelector('[data-aq="' + n + '"]');
    var orphan = !q.trim() && answeredAt(answers, ownIndex(n));
    if (orphan) orphans++;
    if (input) input.classList.toggle('needs', orphan);
  });
  ownState(orphans
    ? 'Write the question above your answer, or clear the answer.'
    : '', orphans ? 'err' : '');

  btn.disabled = !consent.checked || missing.length > 0 || orphans > 0;

  if (!prog) return;
  if (!missing.length) {
    prog.textContent = 'All ' + state.questions.length + ' questions answered.';
    prog.className = 'save-note ok';
  } else {
    var done = state.questions.length - missing.length;
    prog.textContent = done + ' of ' + state.questions.length + ' answered — still to go: ' +
      missing.join(', ') + '.';
    prog.className = 'save-note';
  }
}

/* ── Kelly's voice ──
 * One clip at a time: starting a question mid-intro should stop the intro
 * rather than talk over it. The button reflects play/pause state so it's
 * obvious what's making the sound.
 */
var player = { audio: null, btn: null };

function toggleListen(btn) {
  if (player.btn === btn && player.audio && !player.audio.paused) return stopListen();
  stopListen();

  var audio = new Audio(btn.dataset.listen);
  player = { audio: audio, btn: btn };
  setListenLabel(btn, true);

  audio.addEventListener('ended', stopListen);
  audio.addEventListener('error', function() {
    setListenLabel(btn, false);
    // Silent failure is fine here — the question is on screen in full, so a
    // missing clip costs nothing but the nicety.
    player = { audio: null, btn: null };
  });
  audio.play().catch(function() {
    setListenLabel(btn, false);
    player = { audio: null, btn: null };
  });
}

function stopListen() {
  if (player.audio) { player.audio.pause(); player.audio.currentTime = 0; }
  if (player.btn) setListenLabel(player.btn, false);
  player = { audio: null, btn: null };
}

function setListenLabel(btn, playing) {
  var isIntro = btn.classList.contains('listen-btn');
  var label = playing
    ? (isIntro ? 'Stop' : 'Stop')
    : (isIntro ? 'Hear from Kelly' : 'Hear Kelly read this');
  btn.innerHTML = (playing ? ICON_PAUSE : ICON_SPEAKER) + label;
}

/* ── Audio recording ──
 * Browsers disagree on container format: desktop Chrome/Firefox produce
 * audio/webm (opus), iOS/macOS Safari produce audio/mp4 (aac). We ask for
 * whichever the browser reports it can make and send that content-type
 * through; the server accepts both and ElevenLabs transcribes both.
 */

var MIME_CANDIDATES = [
  'audio/webm;codecs=opus',
  'audio/webm',
  'audio/mp4',
  'audio/ogg;codecs=opus',
];
var MAX_SECONDS = 600; // 10 min — keeps uploads inside the request-body limit
var rec = { index: null, recorder: null, chunks: [], stream: null, timer: null, seconds: 0 };

function supportsRecording() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
            window.MediaRecorder && pickMime());
}

function pickMime() {
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return null;
  for (var i = 0; i < MIME_CANDIDATES.length; i++) {
    if (MediaRecorder.isTypeSupported(MIME_CANDIDATES[i])) return MIME_CANDIDATES[i];
  }
  return null;
}

function toggleRecording(i) {
  if (rec.index === i && rec.recorder && rec.recorder.state === 'recording') return stopRecording();
  if (rec.recorder && rec.recorder.state === 'recording') return; // one at a time
  startRecording(i);
}

async function startRecording(i) {
  recState(i, 'Requesting microphone…');
  try {
    var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    var mime = pickMime();
    // 32 kbps mono is ample for speech and keeps a 10-minute answer near 2.4 MB.
    var recorder = new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 32000 });

    rec = { index: i, recorder: recorder, chunks: [], stream: stream, timer: null, seconds: 0 };

    recorder.ondataavailable = function(e) { if (e.data && e.data.size) rec.chunks.push(e.data); };
    recorder.onstop = function() { uploadRecording(i, mime); };
    recorder.start();

    setRecButton(i, true);
    recState(i, '');
    rec.timer = setInterval(function() {
      rec.seconds++;
      var el = document.getElementById('timer-' + i);
      if (el) el.textContent = fmtTime(rec.seconds);
      if (rec.seconds >= MAX_SECONDS) {
        stopRecording();
        recState(i, 'Reached the 10 minute limit — saving what you recorded.');
      }
    }, 1000);
  } catch (err) {
    var msg = (err && err.name === 'NotAllowedError')
      ? 'Microphone access was blocked. Allow it in your browser settings, or type your answer instead.'
      : 'Could not start recording. You can type your answer instead.';
    recState(i, msg, 'err');
  }
}

function stopRecording() {
  if (!rec.recorder || rec.recorder.state !== 'recording') return;
  clearInterval(rec.timer);
  rec.recorder.stop();
  if (rec.stream) rec.stream.getTracks().forEach(function(t) { t.stop(); });
  setRecButton(rec.index, false);
}

async function uploadRecording(i, mime) {
  var blob = new Blob(rec.chunks, { type: mime });
  var contentType = mime.split(';')[0];

  // Local playback immediately — don't make them wait on the upload to hear it.
  var pb = document.getElementById('playback-' + i);
  if (pb) {
    pb.innerHTML = '<audio class="rec-audio" controls src="' + URL.createObjectURL(blob) + '"></audio>' +
      '<div class="rec-hint">Recording again will replace this one.</div>';
  }

  recState(i, 'Uploading…');
  uploading++;
  try {
    var res = await fetch('/api/qna-audio?token=' + encodeURIComponent(TOKEN) + '&q=' + i, {
      method: 'POST',
      headers: { 'Content-Type': contentType },
      body: blob,
    });
    if (!res.ok) {
      var e = await res.json().catch(function() { return {}; });
      throw new Error(e.error || 'Upload failed');
    }
    recState(i, 'Recording saved', 'ok');
    if (!state.hasAudio) state.hasAudio = [];
    state.hasAudio[i] = true;
    // The signed URL from page load now points at a replaced take. The local
    // blob player above is what should be heard until the next reload.
    if (state.audio) state.audio[i] = null;
    // Re-gates the submit button and retires this slot's "different question"
    // option now that it holds an answer.
    updateSubmitState();
  } catch (err) {
    recState(i, err.message + ' — you can try recording again.', 'err');
  } finally {
    uploading--;
    if (uploading === 0 && savePending) { savePending = false; saveNow(); }
  }
}

function setRecButton(i, isRecording) {
  var btn = document.querySelector('[data-rec="' + i + '"]');
  if (!btn) return;
  btn.classList.toggle('recording', isRecording);
  btn.querySelector('.rec-label').textContent = isRecording ? 'Stop' : 'Record';
  // Lock the other buttons so two recorders can't run at once.
  document.querySelectorAll('[data-rec]').forEach(function(b) {
    if (Number(b.dataset.rec) !== i) b.disabled = isRecording;
  });
  if (!isRecording) {
    var t = document.getElementById('timer-' + i);
    if (t) t.textContent = '';
  }
}

function recState(i, msg, cls) {
  var el = document.getElementById('recstate-' + i);
  if (!el) return;
  el.textContent = msg || '';
  el.className = 'rec-state' + (cls ? ' ' + cls : '');
}

function fmtTime(s) {
  var m = Math.floor(s / 60);
  return m + ':' + String(s % 60).padStart(2, '0');
}

function currentAnswers() {
  var total = state.questions.length + state.authorQuestions.length;
  var out = [];
  for (var i = 0; i < total; i++) out[i] = '';
  document.querySelectorAll('textarea[data-i]').forEach(function(t) {
    out[Number(t.dataset.i)] = t.value;
  });
  return out;
}

function scheduleSave() {
  note('');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 1200);
}

async function saveNow() {
  clearTimeout(saveTimer);
  // Never write over an upload that is mid-flight. See `uploading` above.
  if (uploading > 0) { savePending = true; return; }
  try {
    var res = await fetch('/api/qna-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: TOKEN, action: 'save',
        answers: currentAnswers(), authorQuestions: currentAuthorQuestions(),
      }),
    });
    note(res.ok ? 'Saved' : 'Could not save — your text is still here, we\'ll retry.', res.ok ? 'ok' : 'err');
  } catch (err) {
    note('Not saved — check your connection.', 'err');
  }
}

async function submit() {
  var btn = document.getElementById('submit');
  // Submitting mid-upload would write the row from a read taken before the
  // recording landed, losing it — and would also lock the page against fixing
  // it. A couple of seconds of waiting is the whole cost.
  if (uploading > 0) return note('Just finishing saving your recording…');
  btn.disabled = true;
  note('Sending…');
  try {
    var res = await fetch('/api/qna-intake', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: TOKEN, action: 'submit',
        answers: currentAnswers(), authorQuestions: currentAuthorQuestions(), consent: true,
      }),
    });
    if (!res.ok) {
      var e = await res.json().catch(function() { return {}; });
      note(e.error || 'Could not send. Please try again.', 'err');
      // Re-derive rather than blindly re-enabling: if the server refused
      // because an answer is missing, the button should stay off.
      updateSubmitState();
      return;
    }
    renderSubmitted(state.authorName);
    window.scrollTo(0, 0);
  } catch (err) {
    note('Could not send — check your connection and try again.', 'err');
    updateSubmitState();
  }
}

function note(msg, cls) {
  var el = document.getElementById('note');
  if (!el) return;
  el.textContent = msg || '';
  el.className = 'save-note' + (cls ? ' ' + cls : '');
}

function firstName(name) { return String(name || '').trim().split(/\s+/)[0] || ''; }

function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
</body>
</html>
